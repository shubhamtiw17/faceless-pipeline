name: Faceless Pipeline

on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC = 12:00 ET (US lunch peak)
  workflow_dispatch:
    inputs:
      channel: {description: "cash_and_court / rich_loophole / all", default: all}
      force_long: {type: boolean, default: false}
      dry_run: {type: boolean, default: false}
      short_only: {type: boolean, default: false}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: [cash_and_court, rich_loophole]
    steps:
      - name: Skip unselected channel
        if: github.event_name == 'workflow_dispatch' && inputs.channel != 'all' && inputs.channel != matrix.channel
        run: echo "skip" && exit 0
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core libass9
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: cache
          key: footage-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: footage-${{ matrix.channel }}-
      - name: Generate & upload
        if: github.event_name == 'schedule' || inputs.channel == 'all' || inputs.channel == matrix.channel
        run: |
          ARGS="--channel ${{ matrix.channel }}"
          [ "${{ inputs.force_long }}" = "true" ] && ARGS="$ARGS --force-long"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.short_only }}" = "true" ] && ARGS="$ARGS --short-only"
          python -m src.main $ARGS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN_CASH_AND_COURT: ${{ secrets.YT_TOKEN_CASH_AND_COURT }}
          YT_TOKEN_RICH_LOOPHOLE: ${{ secrets.YT_TOKEN_RICH_LOOPHOLE }}
          IG_USER_CASH_AND_COURT: ${{ secrets.IG_USER_CASH_AND_COURT }}
          IG_TOKEN_CASH_AND_COURT: ${{ secrets.IG_TOKEN_CASH_AND_COURT }}
          IG_USER_RICH_LOOPHOLE: ${{ secrets.IG_USER_RICH_LOOPHOLE }}
          IG_TOKEN_RICH_LOOPHOLE: ${{ secrets.IG_TOKEN_RICH_LOOPHOLE }}
      - name: Save history
        if: always()
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "history: ${{ matrix.channel }}" && git pull --rebase && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ matrix.channel }}
          path: |
            output/**/*.mp4
            output/**/uploads.json
            output/**/*.jpg
          retention-days: 3
          if-no-files-found: ignore
